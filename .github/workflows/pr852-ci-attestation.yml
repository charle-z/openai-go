name: PR852 exact-head CI attestation
on:
  push:
    branches:
      - pr852-delimiter-staging-1834119
permissions:
  contents: read
  checks: read
jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Require exact-head fork checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: 1834119e268248d88822c5c8424d2c474a94ea5c
        run: |
          set -euo pipefail
          required=("lint" "test (Go 1.25.x)" "test (Go 1.26.x)")
          for attempt in $(seq 1 40); do
            checks="$(gh api -H 'Accept: application/vnd.github+json' "repos/$REPO/commits/$TARGET_SHA/check-runs?per_page=100")"
            all_green=1
            for name in "${required[@]}"; do
              row="$(jq -r --arg name "$name" '[.check_runs[] | select(.name == $name)] | sort_by(.completed_at // .started_at) | last | [(.status // "missing"), (.conclusion // "")] | @tsv' <<<"$checks")"
              status="${row%%$'\t'*}"
              conclusion="${row#*$'\t'}"
              echo "$name: status=$status conclusion=$conclusion"
              if [[ "$status" == "completed" && "$conclusion" != "success" ]]; then
                echo "required check failed: $name ($conclusion)" >&2
                exit 1
              fi
              if [[ "$status" != "completed" || "$conclusion" != "success" ]]; then
                all_green=0
              fi
            done
            if [[ "$all_green" == 1 ]]; then
              echo "PR852_EXACT_HEAD_CI_GREEN=$TARGET_SHA"
              exit 0
            fi
            sleep 15
          done
          echo "timed out waiting for exact-head checks" >&2
          exit 1
