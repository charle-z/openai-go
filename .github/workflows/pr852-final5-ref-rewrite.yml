name: PR852 final review evidence snapshot
on:
  push:
    branches:
      - pr852-final-staging-7accf61
permissions:
  contents: write
jobs:
  snapshot:
    if: ${{ !contains(github.event.head_commit.message, 'audit: persist PR852 32a c680 reviews') }}
    runs-on: ubuntu-latest
    steps:
      - name: Persist 32a and c680 reviews/comments
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: pr852-final-staging-7accf61
          SHA_A: 32a34d03e693b963fb634ecf86e74de29f908cd0
          SHA_B: c680c496e75003e5abfa935311a9ce480540f965
        run: |
          set -euo pipefail
          out="$(mktemp)"
          {
            echo '=== REVIEWS ==='
            gh api --paginate 'repos/openai/openai-go/pulls/852/reviews?per_page=100' \
              --jq ".[] | select(.commit_id == \"$SHA_A\" or .commit_id == \"$SHA_B\") | {id, user: .user.login, state, submitted_at, commit_id, body}"
            echo '=== REVIEW COMMENTS ==='
            gh api --paginate 'repos/openai/openai-go/pulls/852/comments?per_page=100' \
              --jq ".[] | select(.commit_id == \"$SHA_A\" or .commit_id == \"$SHA_B\") | {id, user: .user.login, created_at, updated_at, commit_id, pull_request_review_id, in_reply_to_id, path, line, original_line, body, html_url}"
          } > "$out"
          encoded="$(base64 -w0 "$out")"
          path='audit/pr852-32a-c680-review-activity.txt'
          sha="$(gh api "repos/$REPO/contents/$path?ref=$BRANCH" --jq .sha 2>/dev/null || true)"
          if [ -n "$sha" ]; then
            gh api --method PUT "repos/$REPO/contents/$path" -f message='audit: persist PR852 32a c680 reviews' -f content="$encoded" -f branch="$BRANCH" -f sha="$sha" >/dev/null
          else
            gh api --method PUT "repos/$REPO/contents/$path" -f message='audit: persist PR852 32a c680 reviews' -f content="$encoded" -f branch="$BRANCH" >/dev/null
          fi
