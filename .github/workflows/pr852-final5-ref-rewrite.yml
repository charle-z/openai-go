name: PR852 unauthenticated review snapshot
on:
  workflow_dispatch:
  push:
    branches:
      - pr852-final-staging-7accf61
permissions:
  contents: write
jobs:
  snapshot:
    if: ${{ !contains(github.event.head_commit.message, 'audit: persist PR852 public review snapshot') }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public upstream review evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: pr852-final-staging-7accf61
          SHA_A: 32a34d03e693b963fb634ecf86e74de29f908cd0
          SHA_B: c680c496e75003e5abfa935311a9ce480540f965
        run: |
          set -euo pipefail
          reviews="$(mktemp)"
          comments="$(mktemp)"
          : > "$reviews"
          : > "$comments"
          for page in $(seq 1 10); do
            body="$(curl -fsSL -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/openai/openai-go/pulls/852/reviews?per_page=100&page=$page")"
            count="$(jq 'length' <<<"$body")"
            jq -c '.[]' <<<"$body" >> "$reviews"
            [ "$count" -lt 100 ] && break
          done
          for page in $(seq 1 10); do
            body="$(curl -fsSL -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/openai/openai-go/pulls/852/comments?per_page=100&page=$page")"
            count="$(jq 'length' <<<"$body")"
            jq -c '.[]' <<<"$body" >> "$comments"
            [ "$count" -lt 100 ] && break
          done
          out="$(mktemp)"
          {
            echo '=== REVIEWS ==='
            jq -c --arg a "$SHA_A" --arg b "$SHA_B" 'select(.commit_id == $a or .commit_id == $b) | {id, user: .user.login, state, submitted_at, commit_id, body}' "$reviews"
            echo '=== REVIEW COMMENTS ==='
            jq -c --arg a "$SHA_A" --arg b "$SHA_B" 'select(.commit_id == $a or .commit_id == $b) | {id, user: .user.login, created_at, updated_at, commit_id, pull_request_review_id, in_reply_to_id, path, line, original_line, body, html_url}' "$comments"
          } > "$out"
          encoded="$(base64 -w0 "$out")"
          path='audit/pr852-public-review-snapshot.txt'
          sha="$(gh api "repos/$REPO/contents/$path?ref=$BRANCH" --jq .sha 2>/dev/null || true)"
          if [ -n "$sha" ]; then
            gh api --method PUT "repos/$REPO/contents/$path" -f message='audit: persist PR852 public review snapshot' -f content="$encoded" -f branch="$BRANCH" -f sha="$sha" >/dev/null
          else
            gh api --method PUT "repos/$REPO/contents/$path" -f message='audit: persist PR852 public review snapshot' -f content="$encoded" -f branch="$BRANCH" >/dev/null
          fi
