name: PR852 persist final review evidence
on:
  push:
    branches:
      - pr852-final-staging-7accf61
permissions:
  contents: write
jobs:
  persist:
    if: ${{ !contains(github.event.head_commit.message, 'audit: persist PR852 final review evidence') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr852-final-staging-7accf61
      - name: Fetch public upstream review comments
        run: |
          set -euo pipefail
          mkdir -p audit
          reviews="$(mktemp)"
          comments="$(mktemp)"
          : > "$reviews"
          : > "$comments"
          for page in $(seq 1 10); do
            body="$(curl -fsSL -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/openai/openai-go/pulls/852/reviews?per_page=100&page=$page")"
            count="$(jq 'length' <<<"$body")"
            jq -c '.[]' <<<"$body" >> "$reviews"
            [ "$count" -lt 100 ] && break
          done
          for page in $(seq 1 10); do
            body="$(curl -fsSL -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/openai/openai-go/pulls/852/comments?per_page=100&page=$page")"
            count="$(jq 'length' <<<"$body")"
            jq -c '.[]' <<<"$body" >> "$comments"
            [ "$count" -lt 100 ] && break
          done
          {
            echo '=== REVIEWS SINCE 20:00Z ==='
            jq -c 'select(.submitted_at != null and .submitted_at >= "2026-09-14T20:00:00Z") | {id, user: .user.login, state, submitted_at, commit_id, body}' "$reviews"
            echo '=== REVIEW COMMENTS SINCE 20:00Z ==='
            jq -c 'select(.created_at >= "2026-09-14T20:00:00Z") | {id, user: .user.login, created_at, updated_at, commit_id, pull_request_review_id, in_reply_to_id, path, line, original_line, body, html_url}' "$comments"
          } > audit/pr852-final-review-evidence.txt
      - name: Commit evidence to staging branch
        run: |
          set -euo pipefail
          git config user.name 'Aeontra'
          git config user.email 'aeontra@localhost'
          git add audit/pr852-final-review-evidence.txt
          git diff --cached --quiet && exit 0
          git commit -m 'audit: persist PR852 final review evidence'
          git push origin HEAD:pr852-final-staging-7accf61
