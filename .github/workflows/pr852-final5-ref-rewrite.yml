name: PR852 32a exact-head CI attestation
on:
  push:
    branches:
      - pr852-final-staging-7accf61
permissions:
  checks: read
  contents: write
jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Require exact-head fork checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: 32a34d03e693b963fb634ecf86e74de29f908cd0
        run: |
          set -euo pipefail
          required=("lint" "test (Go 1.25.x)" "test (Go 1.26.x)")
          for attempt in $(seq 1 40); do
            checks="$(gh api "repos/$REPO/commits/$TARGET_SHA/check-runs?per_page=100")"
            all_green=1
            for name in "${required[@]}"; do
              row="$(jq -r --arg name "$name" '[.check_runs[] | select(.name == $name)] | sort_by(.completed_at // .started_at) | last | [(.status // "missing"), (.conclusion // "")] | @tsv' <<<"$checks")"
              status="${row%%$'\t'*}"
              conclusion="${row#*$'\t'}"
              echo "$name: status=$status conclusion=$conclusion"
              if [[ "$status" == "completed" && "$conclusion" != "success" ]]; then
                exit 1
              fi
              if [[ "$status" != "completed" || "$conclusion" != "success" ]]; then
                all_green=0
              fi
            done
            if [[ "$all_green" == 1 ]]; then
              if gh api "repos/$REPO/git/ref/heads/pr852-ci-green-32a34d0" >/dev/null 2>&1; then
                gh api --method PATCH "repos/$REPO/git/refs/heads/pr852-ci-green-32a34d0" -f sha="$TARGET_SHA" -F force=true >/dev/null
              else
                gh api --method POST "repos/$REPO/git/refs" -f ref='refs/heads/pr852-ci-green-32a34d0' -f sha="$TARGET_SHA" >/dev/null
              fi
              exit 0
            fi
            sleep 15
          done
          exit 1
