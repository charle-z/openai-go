name: PR852 squash 32a exact ref rewrite
on:
  push:
    branches:
      - pr852-final-staging-7accf61
permissions:
  contents: write
jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - name: Rewrite PR head with exact lease
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_OLD: 32a34d03e693b963fb634ecf86e74de29f908cd0
          NEW_HEAD: c680c496e75003e5abfa935311a9ce480540f965
          TARGET_REF: heads/fix/ssestream-decoder-parameter-case
        run: |
          set -euo pipefail
          current="$(gh api "repos/$REPO/git/ref/$TARGET_REF" --jq .object.sha)"
          test "$current" = "$EXPECTED_OLD"
          gh api --method PATCH "repos/$REPO/git/refs/$TARGET_REF" -f sha="$NEW_HEAD" -F force=true >/dev/null
          current="$(gh api "repos/$REPO/git/ref/$TARGET_REF" --jq .object.sha)"
          test "$current" = "$NEW_HEAD"
