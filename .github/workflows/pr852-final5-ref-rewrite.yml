name: PR852 final review snapshot
on:
  push:
    branches:
      - pr852-final-staging-7accf61
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Persist exact-head review activity
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: pr852-final-staging-7accf61
          TARGET_SHA: c5edef5e0be3feecf2364096e69baa489c599ca7
        run: |
          set -euo pipefail
          out="$(mktemp)"
          {
            echo '=== REVIEWS ==='
            gh api --paginate 'repos/openai/openai-go/pulls/852/reviews?per_page=100' \
              --jq ".[] | select(.commit_id == \"$TARGET_SHA\") | {id, user: .user.login, state, submitted_at, commit_id, body}"
            echo '=== REVIEW COMMENTS ==='
            gh api --paginate 'repos/openai/openai-go/pulls/852/comments?per_page=100' \
              --jq ".[] | select(.commit_id == \"$TARGET_SHA\") | {id, user: .user.login, created_at, updated_at, commit_id, pull_request_review_id, in_reply_to_id, path, line, original_line, body, html_url}"
          } > "$out"
          encoded="$(base64 -w0 "$out")"
          path='audit/pr852-final-review-activity.txt'
          sha="$(gh api "repos/$REPO/contents/$path?ref=$BRANCH" --jq .sha 2>/dev/null || true)"
          if [ -n "$sha" ]; then
            gh api --method PUT "repos/$REPO/contents/$path" -f message='audit: persist PR852 final review snapshot' -f content="$encoded" -f branch="$BRANCH" -f sha="$sha" >/dev/null
          else
            gh api --method PUT "repos/$REPO/contents/$path" -f message='audit: persist PR852 final review snapshot' -f content="$encoded" -f branch="$BRANCH" >/dev/null
          fi
